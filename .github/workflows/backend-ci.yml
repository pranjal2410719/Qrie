name: Qrie Backend CI

on:
  push:
    branches:
      - main
      - pr-2
      - 'issue-*'
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: TypeScript Build
        run: npm run build --prefix backend

      - name: Apply Supabase Migrations to Test DB
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/bootstrap.sql || exit 1
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql -h localhost -U postgres -d postgres -f "$f" || exit 1
          done

      - name: Run Full Test Suite (Unit + PostgreSQL Integration)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: qrie_development_jwt_secret_must_be_at_least_32_characters_long!
          LAM_JWT_SECRET: staging_super_secret_jwt_key_at_least_32_characters_long!
          LAM_RELAY_ENABLED: 'true'
          ALLOW_DEMO_AUTH: 'true'
          ALLOWED_ORIGINS: 'http://localhost:3000'
        run: npm test --prefix backend -- --run
